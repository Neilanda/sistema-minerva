<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enviar e-mail · Sistema Minerva</title>
<style>
  :root{--bg:#0c0b09;--surface:#17140d;--ink:#f4ead0;--ink-soft:#bfa96c;--accent:#d4af52;--accent-ink:#171208;--edge:#3a2f1c;color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
    font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:24px 16px;}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:28px 22px;text-align:center;}
  h1{font-size:19px;margin:0 0 6px;color:var(--accent);}
  p{margin:0 0 20px;color:var(--ink-soft);font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;}
  a{display:block;text-decoration:none;font-weight:600;border-radius:13px;padding:14px 18px;margin-top:10px;}
  .primary{background:var(--accent);color:var(--accent-ink);}
  .secondary{border:1px solid var(--edge);color:var(--ink);}
</style>
</head>
<body>
  <div class="card">
    <h1>Enviar e-mail</h1>
    <p>contatoadmminerva@gmail.com</p>
    <a class="primary" href="mailto:contatoadmminerva@gmail.com">Abrir app de e-mail</a>
    <a class="secondary" href="https://mail.google.com/mail/?view=cm&amp;to=contatoadmminerva@gmail.com">Abrir no Gmail</a>
  </div>
  <script>
    try { window.location.href = 'mailto:contatoadmminerva@gmail.com'; } catch (e) {}
  </script>
</body>
</html>
